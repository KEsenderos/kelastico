<!DOCTYPE html>
<!-- KElástico  index.html  版 0.2.4  基づく仕様書：KElastico_仕様書_v0.2.4.md -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KElástico">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>KElástico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="updateBanner" class="update-banner" role="button" tabindex="0" style="display:none"></div>

<header class="app-header">
  <div class="app-brand">
    <img id="appLogo" class="app-logo" src="icons/icon-192.png" alt="" width="32" height="32">
    <h1 id="appTitle">KElástico</h1>
  </div>
  <span id="appVersion" class="version"></span>
</header>

<main class="app-main">
  <div id="msgArea" class="msg-area" role="status" aria-live="polite" style="display:none"></div>

  <section class="card now-panel">
    <div id="nowTitle" class="now-title"></div>
    <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="any" value="0">
    <div class="times">
      <span id="timeCur">0:00</span>
      <span id="timeTotal">--:--</span>
    </div>

    <div class="transport">
      <button id="btnPrev" class="btn-icon" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5v14L9.2 12z"/></svg>
      </button>
      <button id="btnBack" class="btn-icon btn-skip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6v12L3 12zM21 6v12l-8.5-6z"/></svg>
        <span class="skip-num">10</span>
      </button>
      <button id="btnPlay" class="btn-play" type="button">
        <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
      </button>
      <button id="btnFwd" class="btn-icon btn-skip" type="button">
        <span class="skip-num">10</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 6v12L21 12zM3 6v12l8.5-6z"/></svg>
      </button>
      <button id="btnNext" class="btn-icon" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM5 5v14l9.8-7z"/></svg>
      </button>
    </div>

    <div class="sub-controls">
      <button id="btnStop" class="btn-sub" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
        <span id="btnStopLabel"></span>
      </button>
      <button id="btnRepeat" class="btn-sub" type="button"></button>
      <button id="btnReset" class="btn-sub" type="button"></button>
    </div>
  </section>

  <section class="card params">
    <div class="param param-key">
      <div class="param-row">
        <span id="pitchLabel" class="param-label"></span>
        <button id="btnPitchDown" class="btn-step" type="button">−</button>
        <span id="pitchValue" class="param-value"></span>
        <button id="btnPitchUp" class="btn-step" type="button">＋</button>
      </div>
      <input id="pitchSlider" class="slider" type="range" min="-12" max="12" step="1" value="0">
    </div>
    <div class="param param-speed">
      <div class="param-row">
        <span id="speedLabel" class="param-label"></span>
        <button id="btnSpeedDown" class="btn-step" type="button">−</button>
        <span id="speedValue" class="param-value"></span>
        <button id="btnSpeedUp" class="btn-step" type="button">＋</button>
      </div>
      <input id="speedSlider" class="slider" type="range" min="0.5" max="2" step="0.05" value="1">
    </div>
  </section>

  <section class="card list-panel">
    <div class="list-head">
      <h2 id="listTitle"></h2>
      <button id="btnAdd" class="btn-add" type="button"></button>
      <input id="fileInput" type="file" multiple style="display:none">
    </div>
    <p id="listEmpty" class="list-empty" style="display:none"></p>
    <ul id="songList" class="song-list"></ul>
  </section>
</main>

<audio id="kelSilence" loop playsinline preload="auto" style="display:none"></audio>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/media.js"></script>
<script src="js/library.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
